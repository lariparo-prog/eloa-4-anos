<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eloá | 4 aninhos 🍓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#D42E2E;
    --red-dark:#A61B1B;
    --cream:#FCF1DA;
    --green:#4A7C3A;
    --wood:#8B5A2B;
    --ink:#4A2E1A;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#1c2b18;}
  body{
    font-family:'Quicksand',sans-serif;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .stage{
    position:relative;
    width:100%;height:100%;
    max-width:520px;
    margin:0 auto;
    overflow:hidden;
  }

  /* GATE (image 1) split into two swinging doors */
  .gate{
    position:absolute;inset:0;
    display:flex;
    z-index:20;
  }
  .door{
    position:relative;
    width:50%;height:100%;
    overflow:hidden;
    background:#2f5d2a;
    transition:transform 1.4s cubic-bezier(.65,0,.35,1), opacity 1.4s ease;
  }
  .door img{
    position:absolute;top:0;height:100%;width:200%;
    max-width:none;
    object-fit:cover;
  }
  .door.left{transform-origin:left center;}
  .door.right{transform-origin:right center;}
  .door.left img{left:0;}
  .door.right img{right:0;}

  .door.left.open{transform:rotateY(-92deg) translateX(-4%);opacity:0;}
  .door.right.open{transform:rotateY(92deg) translateX(4%);opacity:0;}

  .tap-hint{
    position:absolute;
    bottom:9%;left:50%;transform:translateX(-50%);
    color:#fff8e8;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:.03em;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
    z-index:25;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    animation:pulse 1.8s ease-in-out infinite;
    pointer-events:none;
  }
  .tap-hint span{font-size:1.6rem;}
  @keyframes pulse{0%,100%{opacity:.55;transform:translateX(-50%) translateY(0);}50%{opacity:1;transform:translateX(-50%) translateY(-6px);}}

  /* INVITE CARD (image 2) behind the gate */
  .invite{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(#dff1cf,#c7e2b0);
    z-index:10;
    padding:0;
  }
  .invite-img-wrap{
    position:relative;
    height:100%;
    max-height:100vh;
    display:flex;align-items:center;
  }
  .invite img{
    height:100%;
    max-height:100vh;
    width:auto;
    display:block;
    opacity:0;
    transform:scale(1.03);
    transition:opacity 1.1s ease .5s, transform 1.1s ease .5s;
  }
  .invite.show img{opacity:1;transform:scale(1);}

  .hotspot{
    position:absolute;
    background:transparent;
    border:none;
    cursor:pointer;
  }
  /* positions tuned to the 3 icon row of convite.png */
  .hs-confirmar{ left:4.5%; width:28.5%; top:69.5%; height:9.5%; }
  .hs-presente{  left:36%;  width:28.5%; top:69.5%; height:9.5%; }
  .hs-local{     left:67.5%;width:28.5%; top:69.5%; height:9.5%; }

  .stage:active .gate{filter:brightness(.96);}
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="gate" id="gate">
    <div class="door left"><img src="assets/portao.png" alt=""></div>
    <div class="door right"><img src="assets/portao.png" alt=""></div>
  </div>

  <div class="tap-hint" id="tapHint">
    <span>🍓</span>
    Toque para entrar no bosque
  </div>

  <div class="invite" id="invite">
    <div class="invite-img-wrap">
      <img src="assets/convite.png" alt="Convite de aniversário da Eloá, 4 anos">
      <button class="hotspot hs-confirmar" onclick="location.href='confirmar.html'" aria-label="Confirmar presença"></button>
      <button class="hotspot hs-presente" onclick="location.href='presente.html'" aria-label="Sugestões de presente"></button>
      <button class="hotspot hs-local" onclick="location.href='localizacao.html'" aria-label="Localização"></button>
    </div>
  </div>

</div>

<script>
const stage = document.getElementById('stage');
const gate = document.getElementById('gate');
const invite = document.getElementById('invite');
const tapHint = document.getElementById('tapHint');
let opened = false;

stage.addEventListener('click', () => {
  if(opened) return;
  opened = true;
  tapHint.style.transition = 'opacity .3s ease';
  tapHint.style.opacity = '0';
  gate.querySelector('.left').classList.add('open');
  gate.querySelector('.right').classList.add('open');
  invite.classList.add('show');
  setTimeout(() => { gate.style.display = 'none'; }, 1450);
});
</script>
</body>
</html>
